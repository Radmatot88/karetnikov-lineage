<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">

  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#6B4E03" />
    </linearGradient>
    <linearGradient id="madderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D93838" />
      <stop offset="40%" stop-color="#8B1E1E" />
      <stop offset="85%" stop-color="#4A0E0E" />
      <stop offset="100%" stop-color="#240404" />
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B86E5" />
      <stop offset="45%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B193D" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="darkSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="pbrEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1.2" specularExponent="22" lighting-color="#FFF9DB" result="specOut">
        <fePointLight x="-80" y="-120" z="220" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specular" />
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#darkSlate)" />
  <rect x="16" y="16" width="468" height="468" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10, 5" opacity="0.85" />
  <rect x="26" y="26" width="448" height="448" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="250" y="65" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2.5">ОРОВАЙСКИЙ ВОИНСКИЙ КРЕСТ</text>
  <line x1="110" y1="78" x2="390" y2="78" stroke="url(#goldGrad)" stroke-width="1.5" />
  <g transform="translate(0, 10)" filter="url(#pbrEmboss)">
    <polygon points='250,150 270,210 330,210 280,240 300,300 250,265 200,300 220,240 170,210 230,210' fill='url(#steelGrad)' stroke='url(#goldGrad)' stroke-width='3'/>
        <g filter="url(#dropShadow)">
      <circle cx="250" cy="240" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="7.0"/>
      <circle cx="250" cy="240" r="30.1" fill="none" stroke="url(#goldGrad)" stroke-width="3.0"/>
      <line x1="250" y1="240" x2="285.0" y2="240.0" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="274.7" y2="264.7" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="250.0" y2="275.0" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="225.3" y2="264.7" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="215.0" y2="240.0" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="225.3" y2="215.3" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="250.0" y2="205.0" stroke="url(#goldGrad)" stroke-width="5"/><line x1="250" y1="240" x2="274.7" y2="215.3" stroke="url(#goldGrad)" stroke-width="5"/>
      <circle cx="250" cy="240" r="7.7" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="2.5"/>
      <circle cx="250" cy="240" r="3.5" fill="#0F172A"/>
    </g>
  </g>
  <line x1="130" y1="432" x2="370" y2="432" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="250" y="456" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="13" fill="#E2E8F0" letter-spacing="1.5">195-й пѣхотный полкъ • 1811–1911</text>
</svg>