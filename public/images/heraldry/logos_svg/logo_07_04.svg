<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">

  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#6B4E03" />
    </linearGradient>
    <linearGradient id="madderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D93838" />
      <stop offset="40%" stop-color="#8B1E1E" />
      <stop offset="85%" stop-color="#4A0E0E" />
      <stop offset="100%" stop-color="#240404" />
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B86E5" />
      <stop offset="45%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B193D" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="darkSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="pbrEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1.2" specularExponent="22" lighting-color="#FFF9DB" result="specOut">
        <fePointLight x="-80" y="-120" z="220" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specular" />
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#darkSlate)" />
  <rect x="16" y="16" width="468" height="468" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10, 5" opacity="0.85" />
  <rect x="26" y="26" width="448" height="448" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="250" y="65" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2.5">СЕРДЦЕВОЙ ЩИТОК ГК</text>
  <line x1="110" y1="78" x2="390" y2="78" stroke="url(#goldGrad)" stroke-width="1.5" />
  <g transform="translate(0, 10)" filter="url(#pbrEmboss)">
    <circle cx='250' cy='240' r='85' fill='url(#azureGrad)' stroke='url(#goldGrad)' stroke-width='4'/>
        <text x='250' y='258' text-anchor='middle' font-family='serif' font-size='60' font-weight='bold' fill='url(#goldGrad)'>ГК</text>
        <g filter="url(#dropShadow)">
      <path d="M 211.0 159.25 L 289.0 159.25 L 285.1 138.775 L 289.0 130 L 269.5 141.7 L 250.0 125 L 230.5 141.7 L 211.0 130 L 214.9 138.775 Z" fill="url(#goldGrad)" stroke="#553D00" stroke-width="2"/>
      <rect x="217.24" y="149.0125" width="65.52" height="7.3125" rx="3" fill="url(#madderRed)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="211.0" cy="122.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="220.8" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="230.5" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="240.2" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="250.0" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="259.8" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="269.5" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="279.2" cy="112.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/><circle cx="289.0" cy="122.0" r="2.6" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    </g>
  </g>
  <line x1="130" y1="432" x2="370" y2="432" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="250" y="456" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="13" fill="#E2E8F0" letter-spacing="1.5">Фавиконъ и знакъ аватара</text>
</svg>