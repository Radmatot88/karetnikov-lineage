<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sabanovShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244673" />
      <stop offset="55%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#12243D" />
    </linearGradient>
    <linearGradient id="sabanovGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC16D" />
      <stop offset="50%" stop-color="#B89438" />
      <stop offset="100%" stop-color="#8A6B22" />
    </linearGradient>
    <linearGradient id="sabanovParchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#E8DEC8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0D1B2A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Oak & Laurel Wreath of 105-Year Longevity -->
  <g stroke="url(#sabanovGold)" fill="none" stroke-width="2.5" opacity="0.9">
    <path d="M 75 340 C 35 260, 40 150, 95 80" stroke-width="3" />
    <path d="M 325 340 C 365 260, 360 150, 305 80" stroke-width="3" />
    <!-- Left Oak Leaves -->
    <path d="M 62 290 C 42 280, 40 260, 58 255 C 50 270, 55 282, 62 290 Z" fill="url(#sabanovGold)" />
    <path d="M 55 235 C 35 220, 36 198, 56 196 C 48 210, 50 225, 55 235 Z" fill="url(#sabanovGold)" />
    <path d="M 64 175 C 46 158, 50 136, 70 138 C 60 150, 60 165, 64 175 Z" fill="url(#sabanovGold)" />
    <path d="M 82 120 C 68 102, 75 82, 95 88 C 84 98, 82 110, 82 120 Z" fill="url(#sabanovGold)" />
    <!-- Right Oak Leaves -->
    <path d="M 338 290 C 358 280, 360 260, 342 255 C 350 270, 345 282, 338 290 Z" fill="url(#sabanovGold)" />
    <path d="M 345 235 C 365 220, 364 198, 344 196 C 352 210, 350 225, 345 235 Z" fill="url(#sabanovGold)" />
    <path d="M 336 175 C 354 158, 350 136, 330 138 C 340 150, 340 165, 336 175 Z" fill="url(#sabanovGold)" />
    <path d="M 318 120 C 332 102, 325 82, 305 88 C 316 98, 318 110, 318 120 Z" fill="url(#sabanovGold)" />
  </g>

  <!-- Sovereign French/Imperial Escutcheon Shield -->
  <g filter="url(#dropShadow)">
    <path d="M 90 65 L 310 65 L 310 225 C 310 315, 245 368, 200 398 C 155 368, 90 315, 90 225 Z"
          fill="url(#sabanovShieldBg)"
          stroke="url(#sabanovGold)"
          stroke-width="7"
          stroke-linejoin="round" />
    <!-- Inner Filigree Border -->
    <path d="M 102 77 L 298 77 L 298 223 C 298 304, 240 352, 200 381 C 160 352, 102 304, 102 223 Z"
          fill="none"
          stroke="url(#sabanovGold)"
          stroke-width="1.8"
          stroke-dasharray="6,4"
          opacity="0.75" />
  </g>

  <!-- Radiant Halo of St. Nicholas Parish (New Shustrui) -->
  <circle cx="200" cy="195" r="76" fill="none" stroke="url(#sabanovGold)" stroke-width="1.4" opacity="0.45" />
  <circle cx="200" cy="195" r="64" fill="none" stroke="url(#sabanovGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Orthodox Liturgical Cross-Trefoil (Клиросный крест Никольского храма) -->
  <g fill="url(#sabanovGold)" stroke="#12243D" stroke-width="1.2">
    <!-- Vertical Beam -->
    <rect x="193" y="108" width="14" height="175" rx="3" />
    <!-- Upper Patristic Bar -->
    <rect x="168" y="132" width="64" height="10" rx="2" />
    <!-- Main Horizontal Beam -->
    <rect x="138" y="172" width="124" height="14" rx="3" />
    <!-- Lower Slanted Footrest Bar -->
    <path d="M 166 232 L 234 248 L 234 257 L 166 241 Z" />
    <!-- Trefoil Finials (Трилистники клира) -->
    <circle cx="200" cy="105" r="9" />
    <circle cx="135" cy="179" r="9" />
    <circle cx="265" cy="179" r="9" />
    <circle cx="200" cy="285" r="9" />
    <!-- Center Gem -->
    <circle cx="200" cy="179" r="6" fill="#FAF6EE" />
  </g>

  <!-- 105 Years Longevity Crown Banner inside Shield Base -->
  <g transform="translate(200, 332)">
    <rect x="-56" y="-16" width="112" height="28" rx="6" fill="#12243D" stroke="url(#sabanovGold)" stroke-width="2" />
    <text x="0" y="3" text-anchor="middle" fill="#DFC16D" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.5">105 ЛЕТ</text>
  </g>

  <!-- Motto Ribbon at Bottom -->
  <g transform="translate(200, 435)">
    <path d="M -155 -18 L 155 -18 L 142 18 L -142 18 Z" fill="url(#sabanovParchment)" stroke="url(#sabanovGold)" stroke-width="2.5" />
    <text x="0" y="-1" text-anchor="middle" fill="#1E3A5F" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="1.2">ДОМ САБАНОВЫХ • НОВЫЙ ШУСТРУЙ</text>
    <text x="0" y="13" text-anchor="middle" fill="#4A423B" font-family="Georgia, serif" font-size="10" font-weight="bold" letter-spacing="0.8">ХРАНИТЕЛИ ВЕРЫ И ВЕКОВОГО ДОЛГОЛЕТИЯ</text>
  </g>
</svg>
